<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 시작페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#5B6B8C;
    --sun:#FFC857;
    --coral:#FF6F59;
    --card:#FFFFFF;
    --sky-1:#EAF4FF;
    --sky-2:#FDF6E9;
    --ring:rgba(27,42,74,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    background: linear-gradient(160deg, var(--sky-1) 0%, var(--sky-2) 100%);
    transition: background 1.2s ease;
    overflow-x:hidden;
  }
  /* time-of-day skins, toggled via body classes set by JS */
  body.dawn{ background: linear-gradient(160deg, #FFE3D6 0%, #FFF3D6 55%, #EAF4FF 100%); }
  body.day{ background: linear-gradient(160deg, #EAF4FF 0%, #F6FAFF 55%, #FDF6E9 100%); }
  body.dusk{ background: linear-gradient(160deg, #FFD9C2 0%, #FFB199 45%, #E8C2FF 100%); }
  body.night{ background: linear-gradient(160deg, #16223F 0%, #1B2A4A 55%, #2A3A63 100%); }
  body.night{ color:#EAF0FF; }
  body.night .card{ background:#22315A; color:#EAF0FF; box-shadow:0 12px 30px rgba(0,0,0,0.35); }
  body.night .card h2{ color:#FFDD9A; }
  body.night .greet{ color:#EAF0FF; }
  body.night .subgreet{ color:#B6C2E6; }
  body.night input#searchInput{ background:#1B2A4A; color:#EAF0FF; border-color:#3A4C7A; }
  body.night .search-wrap{ box-shadow:0 10px 26px rgba(0,0,0,0.35); }

  .stars{
    position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity 1s ease;
  }
  body.night .stars{ opacity:1; }

  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:56px 24px 80px;
  }

  /* HERO */
  .hero{
    text-align:center;
    padding: 24px 0 40px;
  }
  .greet{
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 18px;
    font-weight:500;
  }
  .clock{
    font-family:'Outfit', sans-serif;
    font-weight:700;
    font-size:clamp(58px, 13vw, 132px);
    line-height:1;
    letter-spacing:-0.02em;
    margin:0;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:14px;
  }
  .clock .ampm{
    font-size:clamp(16px,3vw,26px);
    font-weight:500;
    color:var(--coral);
    align-self:flex-start;
    margin-top:14px;
  }
  .date{
    font-size:16px;
    color:var(--ink-soft);
    margin-top:10px;
    font-weight:500;
  }

  /* SEARCH */
  .search-wrap{
    margin:36px auto 0;
    max-width:600px;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border-radius:999px;
    padding:8px 8px 8px 22px;
    box-shadow:0 10px 26px rgba(27,42,74,0.10);
    transition: box-shadow .2s ease, transform .15s ease;
  }
  .search-wrap:focus-within{
    box-shadow:0 12px 30px rgba(27,42,74,0.16);
    transform:translateY(-1px);
  }
  .search-wrap svg{ flex:0 0 auto; opacity:0.55; }
  #searchInput{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Noto Sans KR', sans-serif;
    font-size:16px;
    color:var(--ink);
    padding:10px 0;
  }
  .engine-toggle{
    display:flex;
    gap:4px;
    background:rgba(27,42,74,0.06);
    border-radius:999px;
    padding:4px;
    flex:0 0 auto;
  }
  .engine-toggle button{
    border:none;
    background:transparent;
    padding:8px 14px;
    border-radius:999px;
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
    transition: all .15s ease;
  }
  .engine-toggle button.active{
    background:var(--ink);
    color:#fff;
  }
  .search-go{
    flex:0 0 auto;
    width:44px; height:44px;
    border-radius:50%;
    border:none;
    background:var(--sun);
    color:var(--ink);
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease, background .15s ease;
  }
  .search-go:hover{ transform:scale(1.06); }

  /* GRID */
  .grid{
    display:grid;
    grid-template-columns: 1fr 1.3fr;
    gap:22px;
    margin-top:48px;
    align-items:start;
  }
  @media (max-width: 760px){
    .grid{ grid-template-columns: 1fr; }
  }

  .card{
    background:var(--card);
    border-radius:24px;
    padding:28px 26px;
    box-shadow:0 10px 30px rgba(27,42,74,0.07);
  }
  .card h2{
    margin:0 0 18px;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--coral);
    font-weight:700;
  }

  /* WEATHER */
  .weather-top{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .weather-icon{ font-size:56px; line-height:1; }
  .weather-temp{
    font-family:'Outfit', sans-serif;
    font-size:52px;
    font-weight:700;
    line-height:1;
  }
  .weather-desc{
    font-size:15px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .weather-meta{
    display:flex;
    gap:22px;
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--ring);
  }
  .weather-meta div{ font-size:13px; color:var(--ink-soft); }
  .weather-meta b{ display:block; font-size:16px; color:var(--ink); font-weight:700; margin-top:2px; }
  body.night .weather-meta b{ color:#EAF0FF; }
  .weather-loading, .news-loading{
    color:var(--ink-soft); font-size:14px;
  }

  /* NEWS */
  .news-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .news-list li{ border-bottom:1px solid var(--ring); padding-bottom:14px; }
  .news-list li:last-child{ border-bottom:none; padding-bottom:0; }
  .news-list a{
    color:var(--ink);
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    line-height:1.5;
    display:block;
  }
  body.night .news-list a{ color:#EAF0FF; }
  .news-list a:hover{ color:var(--coral); }
  .news-source{
    display:inline-block;
    margin-top:5px;
    font-size:12px;
    color:var(--ink-soft);
  }

  footer{
    text-align:center;
    margin-top:56px;
    font-size:12px;
    color:var(--ink-soft);
  }

  a, button{ font-family:'Noto Sans KR', sans-serif; }
  ::selection{ background:var(--sun); color:var(--ink); }
</style>
</head>
<body>

<canvas class="stars" id="stars"></canvas>

<div class="wrap">

  <section class="hero">
    <p class="greet" id="greeting">좋은 하루예요</p>
    <h1 class="clock" id="clock">--:--<span class="ampm" id="ampm"></span></h1>
    <p class="date" id="dateStr"></p>

    <form class="search-wrap" id="searchForm" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="검색어를 입력하세요" autocomplete="off" autofocus>
      <div class="engine-toggle" id="engineToggle">
        <button type="button" data-engine="google" class="active">Google</button>
        <button type="button" data-engine="naver">Naver</button>
      </div>
      <button class="search-go" id="searchGo" aria-label="검색" type="submit">→</button>
    </form>
  </section>

  <section class="grid">
    <div class="card" id="weatherCard">
      <h2>서울 날씨</h2>
      <div id="weatherBody" class="weather-loading">불러오는 중…</div>
    </div>

    <div class="card" id="newsCard">
      <h2>기술 뉴스</h2>
      <div id="newsBody" class="news-loading">불러오는 중…</div>
    </div>
  </section>

  <footer>매일 아침, 오늘의 날씨와 기술 소식을 한눈에</footer>
</div>

<script>
/* ---------- 시계 & 인사말 & 시간대 스킨 ---------- */
function pad(n){ return n.toString().padStart(2,'0'); }

function updateClock(){
  const now = new Date();
  const h24 = now.getHours();
  const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  const m = pad(now.getMinutes());
  const s = pad(now.getSeconds());
  document.getElementById('clock').innerHTML = `${pad(h12)}:${m}:${s}<span class="ampm" id="ampm">${h24 < 12 ? 'AM' : 'PM'}</span>`;

  const days = ['일','월','화','수','목','금','토'];
  const dateStr = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
  document.getElementById('dateStr').textContent = dateStr;

  let greeting, skin;
  if (h24 >= 5 && h24 < 7){ greeting='상쾌한 새벽이에요'; skin='dawn'; }
  else if (h24 >= 7 && h24 < 11){ greeting='좋은 아침이에요'; skin='day'; }
  else if (h24 >= 11 && h24 < 14){ greeting='활기찬 점심이에요'; skin='day'; }
  else if (h24 >= 14 && h24 < 18){ greeting='나른한 오후예요'; skin='day'; }
  else if (h24 >= 18 && h24 < 20){ greeting='노을 지는 저녁이에요'; skin='dusk'; }
  else if (h24 >= 20 && h24 < 23){ greeting='편안한 밤이에요'; skin='night'; }
  else { greeting='고요한 새벽이에요'; skin='night'; }

  document.getElementById('greeting').textContent = greeting;
  document.body.classList.remove('dawn','day','dusk','night');
  document.body.classList.add(skin);
}
updateClock();
setInterval(updateClock, 1000);

/* ---------- 밤 시간 별빛 캔버스 ---------- */
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];
function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  stars = Array.from({length:90}, () => ({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height*0.6,
    r: Math.random()*1.4 + 0.3,
    tw: Math.random()*Math.PI*2
  }));
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const isNight = document.body.classList.contains('night');
  if (isNight){
    stars.forEach(st=>{
      st.tw += 0.02;
      const alpha = 0.4 + Math.sin(st.tw)*0.4;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${Math.max(alpha,0.1)})`;
      ctx.fill();
    });
  }
  requestAnimationFrame(drawStars);
}
drawStars();

/* ---------- 검색 ---------- */
let currentEngine = 'google';
document.getElementById('engineToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if (!btn) return;
  currentEngine = btn.dataset.engine;
  document.querySelectorAll('.engine-toggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
});
document.getElementById('searchForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const url = currentEngine === 'google'
    ? `https://www.google.com/search?q=${encodeURIComponent(q)}`
    : `https://search.naver.com/search.naver?query=${encodeURIComponent(q)}`;
  window.open(url, '_blank');
});

/* ---------- 날씨 (Open-Meteo, 서울) ---------- */
const WEATHER_CODES = {
  0:['맑음','☀️'], 1:['대체로 맑음','🌤️'], 2:['구름 조금','⛅'], 3:['흐림','☁️'],
  45:['안개','🌫️'], 48:['짙은 안개','🌫️'],
  51:['이슬비','🌦️'], 53:['이슬비','🌦️'], 55:['강한 이슬비','🌦️'],
  61:['약한 비','🌧️'], 63:['비','🌧️'], 65:['강한 비','🌧️'],
  71:['약한 눈','🌨️'], 73:['눈','🌨️'], 75:['강한 눈','❄️'],
  80:['소나기','🌦️'], 81:['소나기','🌦️'], 82:['강한 소나기','⛈️'],
  95:['뇌우','⛈️'], 96:['뇌우(우박)','⛈️'], 99:['강한 뇌우','⛈️']
};

async function loadWeather(){
  const body = document.getElementById('weatherBody');
  try{
    const lat = 37.5665, lon = 126.9780;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=Asia%2FSeoul`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('weather fetch failed');
    const data = await res.json();
    const c = data.current;
    const [desc, icon] = WEATHER_CODES[c.weather_code] || ['알 수 없음','🌡️'];

    body.classList.remove('weather-loading');
    body.innerHTML = `
      <div class="weather-top">
        <div class="weather-icon">${icon}</div>
        <div>
          <div class="weather-temp">${Math.round(c.temperature_2m)}°</div>
          <div class="weather-desc">${desc} · 체감 ${Math.round(c.apparent_temperature)}°</div>
        </div>
      </div>
      <div class="weather-meta">
        <div>습도<b>${Math.round(c.relative_humidity_2m)}%</b></div>
        <div>바람<b>${c.wind_speed_10m.toFixed(1)}m/s</b></div>
        <div>위치<b>서울</b></div>
      </div>
    `;
  }catch(err){
    body.innerHTML = `날씨 정보를 불러오지 못했어요. 잠시 후 새로고침 해주세요.`;
  }
}
loadWeather();
setInterval(loadWeather, 10*60*1000); // 10분마다 갱신

/* ---------- 기술 뉴스 (RSS -> JSON 변환 서비스 이용) ---------- */
async function loadNews(){
  const body = document.getElementById('newsBody');
  const feedUrl = 'https://news.google.com/rss/search?q=%EA%B8%B0%EC%88%A0%20when:1d&hl=ko&gl=KR&ceid=KR:ko';
  const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`;
  try{
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error('news fetch failed');
    const data = await res.json();
    if (data.status !== 'ok' || !data.items || !data.items.length) throw new Error('empty');

    const items = data.items.slice(0, 8);
    body.innerHTML = `<ul class="news-list">${
      items.map(it=>{
        const title = it.title.replace(/ - .*$/, '');
        const source = (it.title.match(/ - (.*)$/) || [,''])[1];
        return `<li><a href="${it.link}" target="_blank" rel="noopener">${title}</a><span class="news-source">${source}</span></li>`;
      }).join('')
    }</ul>`;
  }catch(err){
    body.innerHTML = `뉴스를 불러오지 못했어요. <a href="https://news.google.com/search?q=%EA%B8%B0%EC%88%A0&hl=ko&gl=KR&ceid=KR:ko" target="_blank" rel="noopener">여기서 직접 확인하기 →</a>`;
  }
}
loadNews();
setInterval(loadNews, 15*60*1000); // 15분마다 갱신
</script>

</body>
</html>
